spring.application.name=lab5
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-alias=seii

# --- Ejercicio 4 (c): Mutual TLS (mTLS) ---
# El servidor exige que el cliente presente un certificado valido (need).
# Su parte publica debe estar en truststore.p12 (ver README seccion mTLS).
server.ssl.client-auth=need
server.ssl.trust-store=classpath:truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${TRUSTSTORE_PASSWORD}
